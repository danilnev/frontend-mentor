<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Results summary component</title>

  <link rel="stylesheet" href="style.css" type="text/css">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <main>
    
    <div>
      <h2>Your Result</h2>  
      <div id="circle">
        <p class="result">76</p>
        <p class="of-how-many">of 100</p>
      </div>
      <h3>Great</h3>
      <p>You scored higher than 65% of the people who have taken these tests.</p>
    </div>
    
    <div class="summary">
      <h2>Summary</h2>

      <div class="reaction">
        <img src="images/icon-reaction.svg" alt="icon-reaction">
        <p class="title">Reaction</p>
        <p class="balls">80 / 100</p>
      </div>

      <div class="memory">
        <img src="images/icon-memory.svg" alt="icon-memory">
        <p class="title">Memory</p>
        <p class="balls">92 / 100</p>
      </div>

      <div class="verbal">
        <img src="images/icon-verbal.svg" alt="icon-verbal">
        <p class="title">Verbal</p>
        <p class="balls">61 / 100</p>
      </div>

      <div class="visual">
        <img src="images/icon-visual.svg" alt="icon-visual">
        <p class="title">Visual</p>
        <p class="balls">72 / 100</p>
      </div>
      
      <a href="">Continue</a>
    </div>
  </main>
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div>
</body>
</html>
