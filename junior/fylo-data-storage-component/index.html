<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Fylo data storage component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>

  <main>

    <div class="content">

      <div>
        <img src="images/logo.svg" alt="">

        <div>
          <div><img src="images/icon-document.svg" alt=""></div>
          <div><img src="images/icon-folder.svg" alt=""></div>
          <div><img src="images/icon-upload.svg" alt=""></div>
        </div>
      </div>

      <div>
        <div>
          <span>185</span><span>GB Left</span>
        </div>

        <p>You’ve used <span>815 GB</span> of your storage</p>

        <div class="progress">
          <div class="progress-bar">
            <div class="circle"></div>
          </div>
        </div>

        <div>
          <p>0 GB</p>
          <p>1000 GB</p>
        </div>
      </div>

    </div>

  </main>

  

  
  
  
  
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
